services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mangongchang
      POSTGRES_USER: mangongchang
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mangongchang -d mangongchang"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVICE_ROLE: web
      HOST: 0.0.0.0
      PORT: 4173
      DATABASE_URL: postgresql://mangongchang:${POSTGRES_PASSWORD}@postgres:5432/mangongchang
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      JOB_DISPATCH_INTERVAL_MS: ${JOB_DISPATCH_INTERVAL_MS:-5000}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Set AUTH_PASSWORD in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1536}
      LOCAL_STORAGE_DIR: /data/assets
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    ports:
      - "4173:4173"
    volumes:
      - comic_assets:/data/assets
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    environment:
      SERVICE_ROLE: worker
      DATABASE_URL: postgresql://mangongchang:${POSTGRES_PASSWORD}@postgres:5432/mangongchang
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-2}
      LOCAL_STORAGE_DIR: /data/assets
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-mock}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
    volumes:
      - comic_assets:/data/assets

  backup:
    profiles: ["backup"]
    build:
      context: .
      dockerfile: Dockerfile.backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mangongchang:${POSTGRES_PASSWORD}@postgres:5432/mangongchang
      LOCAL_STORAGE_DIR: /assets
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETRY_SECONDS: ${BACKUP_RETRY_SECONDS:-300}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-90}
      S3_BUCKET: ${S3_BUCKET:-}
    volumes:
      - comic_assets:/assets:ro
      - backup_data:/backups
    command:
      - sh
      - -c
      - |
        set -eu
        node -e 'const limits={BACKUP_INTERVAL_SECONDS:[60,31536000],BACKUP_RETRY_SECONDS:[30,86400],BACKUP_KEEP:[1,1000],BACKUP_RETENTION_DAYS:[7,3650]}; for(const [key,[min,max]] of Object.entries(limits)){const value=Number(process.env[key]);if(!Number.isSafeInteger(value)||value<min||value>max){console.error(key+" must be an integer between "+min+" and "+max);process.exit(1)}}'
        while true; do
          if [ -n "$${S3_BUCKET}" ]; then
            echo "S3 图片存储已启用；容器备份已暂停，请使用对象存储侧备份策略。"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
            continue
          fi
          if node /app/scripts/backup-postgres.mjs; then
            node /app/scripts/prune-backups.mjs --apply --keep="$${BACKUP_KEEP}" --retention-days="$${BACKUP_RETENTION_DAYS}" || echo "备份保留清理失败；现有备份已保留。"
            sleep "$${BACKUP_INTERVAL_SECONDS}"
          else
            echo "PostgreSQL 备份失败；跳过清理并在 $${BACKUP_RETRY_SECONDS} 秒后重试。"
            sleep "$${BACKUP_RETRY_SECONDS}"
          fi
        done

volumes:
  postgres_data:
  redis_data:
  comic_assets:
  backup_data:
